name: Validar piloto colaboradores (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    if: github.ref == 'refs/heads/colaboradores/piloto-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Permisos, atribución e inventario saneado
        working-directory: colaboradores
        run: |
          npm test
          npm run check
