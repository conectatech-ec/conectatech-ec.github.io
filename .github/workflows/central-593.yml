name: Normalizar reporte 593 aislado
on:
  push:
    branches: ['automatizacion/piloto-cloud-3sku-20261015']
    paths: ['.github/workflows/central-593.yml', 'automatizacion/process_pending_593.py', 'automatizacion/data_hub_593.py', 'automatizacion/activar-cloud.json']
permissions:
  contents: read
concurrency:
  group: comercial-cloud-piloto
  cancel-in-progress: false
jobs:
  ingresar:
    if: github.ref == 'refs/heads/automatizacion/piloto-cloud-3sku-20261015'
    environment: conectatech-piloto-gratis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            automatizacion
            .github/workflows
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar nucleo 593 aislado antes de leer la fuente privada
        run: |
          python automatizacion/tests/sync_593_test.py
          node automatizacion/tests/sync-receiver.test.mjs
          python automatizacion/tests/scoped_integration_test.py
          python automatizacion/tests/scoped_content_test.py
          python automatizacion/tests/generic_receiver_guard_test.py
          node automatizacion/tests/scoped-http.test.mjs
      - id: scoped_mode
        name: Mantener escrituras cerradas hasta promocion expresa tras inspeccion
        run: |
          python - <<'PY'
          import json,os
          c=json.load(open('automatizacion/activar-cloud.json'))
          allowed=c.get('datahub_scoped_content_enabled') is True and c.get('activar') is False and c.get('sincronizar_meta_verify_token',False) is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('authorized='+str(allowed).lower()+'\n')
          PY
      - id: bootstrap
        if: steps.scoped_mode.outputs.authorized == 'true'
        name: Actualizar solo receptor DataHub conservando el Worker realmente activo
        run: python automatizacion/scoped_content.py --bootstrap
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - id: reporte
        if: steps.bootstrap.outputs.ready == 'true'
        name: Leer una fuente privada y normalizar con reglas unicas
        run: python automatizacion/process_pending_593.py
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - id: revision
        if: steps.reporte.outputs.ready == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Actualizar solo fuente comercial validada con reserva del mismo job
        if: steps.reporte.outputs.ready == 'true'
        run: python automatizacion/scoped_content.py --ingest
        env:
          CENTRAL_EXPECTED_SOURCE_SHA256: ${{ steps.reporte.outputs.validated_source_sha256 }}
          COMMERCIAL_PROCESSOR_EXPECTED_RELEASE: ${{ steps.bootstrap.outputs.processor_release }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Comprobar importes y protecciones del piloto por HTTPS
        if: steps.reporte.outputs.ready == 'true'
        run: node automatizacion/central-e2e.mjs
        env:
          PILOT_BASE_URL: https://conectatech-comercial-piloto.conectatech-ecu.workers.dev
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          EXPECTED_RELEASE: ${{ steps.bootstrap.outputs.runtime_release }}
          EXPECTED_PROCESSOR_RELEASE: ${{ steps.bootstrap.outputs.processor_release }}
      - name: Verificar version comercial recibida por Alex y registrar destinos pendientes
        if: steps.reporte.outputs.ready == 'true'
        run: python automatizacion/data_hub_593.py --verify-alex
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Borrar el original privado tras procesamiento verificado
        if: steps.reporte.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'automatizacion')
          from process_pending_593 import request
          from processing_lease import finish
          d=json.load(open('automatizacion/central/current.json'))
          result=finish(request,'processed',validation=d['source'])
          assert result['raw_file_erased'] is True
          print('Report processed; encrypted original erased; production destinations unchanged.')
          PY
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Liberar reserva tras fallo o interrupcion controlada
        if: always()
        run: python automatizacion/processing_lease.py --release
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuente-593-validada-sin-datos-privados
          path: |
            automatizacion/generated/fase2/central-processing.json
            automatizacion/generated/fase2/central-cloud.json
          retention-days: 7
