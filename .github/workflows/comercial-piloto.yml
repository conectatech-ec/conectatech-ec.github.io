name: Piloto comercial aislado
on:
  pull_request:
    branches: ['automatizacion/piloto-cloud-3sku-20261015']
    paths: ['automatizacion/**', '.github/workflows/comercial-piloto.yml']
  push:
    branches: ['automatizacion/piloto-cloud-3sku-20261015']
    paths: ['automatizacion/**', '.github/workflows/comercial-piloto.yml']
permissions:
  contents: read
concurrency:
  group: comercial-piloto-aislado
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /automatizacion/
            /exportaciones/catalogo-ventas.json
            /seo-contenido.json
            /importacion/medios.json
            /datos-593/inventario-publico.csv
      - name: Read approved public resolver code for synthetic fixtures
        uses: actions/checkout@v4
        with:
          ref: 67f5a762e9c702034b2450ba4fbc8cfdfb0bfbfb
          path: qa-public-reference
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/editorial-titulos.js
            /scripts/editorial-fotografia-efectiva.cjs
            /scripts/fotografia-direccion.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python automatizacion/build.py
      - run: node automatizacion/tests/worker.test.mjs
      - run: node automatizacion/tests/live.test.mjs
      - run: node automatizacion/tests/messenger.test.mjs
      - run: node automatizacion/tests/seller.test.mjs
      - run: node automatizacion/tests/alex.test.mjs
      - run: node automatizacion/tests/alex-upgrade.test.mjs
      - run: node automatizacion/tests/alex-commercial.test.mjs
      - run: node automatizacion/tests/alex-samsung.test.mjs
      - run: node automatizacion/tests/alex-objections.test.mjs
      - run: node automatizacion/tests/alex-presentation.test.mjs
        env:
          ALEX_PUBLIC_HELPERS_REFERENCE: ${{ github.workspace }}/qa-public-reference
      - run: node automatizacion/tests/messenger-runner-fixture.test.mjs
      - run: node automatizacion/tests/messenger-closed-ingress.test.mjs
      - run: node automatizacion/tests/private-source-preflight.test.mjs
      - run: python automatizacion/tests/central_593_test.py
      - run: python automatizacion/tests/data_hub_test.py
      - run: node automatizacion/tests/central.test.mjs
      - run: node automatizacion/tests/marketplace.test.mjs
      - name: Ensayo integral Messenger en runner HTTP local con SQLite real
        run: node automatizacion/messenger-runner-e2e.mjs
      - run: python automatizacion/tests/deploy_test.py
      - name: Prueba integral con fuentes y medios públicos reales
        run: node automatizacion/alex-catalog-e2e.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: piloto-comercial-3sku
          path: automatizacion/generated/
          retention-days: 7
