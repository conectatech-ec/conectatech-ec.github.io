name: Activar piloto cloud gratuito
on:
  push:
    branches: ['automatizacion/piloto-cloud-3sku-20261015']
    paths: ['automatizacion/activar-cloud.json', '.github/workflows/comercial-cloud.yml']
permissions:
  contents: read
concurrency:
  group: comercial-cloud-piloto
  cancel-in-progress: false
jobs:
  preparar:
    if: github.ref == 'refs/heads/automatizacion/piloto-cloud-3sku-20261015'
    environment: conectatech-piloto-gratis
    runs-on: ubuntu-latest
    outputs:
      activar: ${{ steps.config.outputs.activar }}
      sincronizar_meta: ${{ steps.config.outputs.sincronizar_meta }}
      ready: ${{ steps.conexion.outputs.ready }}
      closed_ingress_only: ${{ steps.config.outputs.closed_ingress_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automatizacion
      - id: config
        run: |
          python - <<'PYCONFIG'
          import json, os, re
          c=json.load(open("automatizacion/activar-cloud.json"))
          smoke=c.get("verificar_presentacion_sin_desplegar") is True
          release=c.get("release_verificacion", "")
          if smoke and (c.get("activar") is not False or c.get("sincronizar_meta_verify_token", False) is not False):
              raise ValueError("PRESENTATION_VERIFY_REQUIRES_DEPLOY_AND_SYNC_DISABLED")
          if smoke and (not isinstance(release, str) or not re.fullmatch(r"[a-f0-9]{40}", release)):
              raise ValueError("PRESENTATION_VERIFY_RELEASE_REQUIRED")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("activar="+str(c["activar"]).lower()+"\n")
              out.write("sincronizar_meta="+str(c.get("sincronizar_meta_verify_token", False)).lower()+"\n")
              out.write("closed_ingress_only="+str(c.get("alex_validation")=="marketplace_pilot").lower()+"\n")
              out.write("verificar_presentacion="+str(smoke).lower()+"\n")
              out.write("release_verificacion="+(release if smoke else "")+"\n")
              out.write("hub017_identity="+str(c.get("aprobar_identidad_hub017") is True).lower()+"\n")
          PYCONFIG
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer configuracion del Worker, recepcion Meta y estado de logs sin modificar recursos
        id: conexion
        run: python automatizacion/deploy_free.py --check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estado-conexion-cloud
          path: automatizacion/generated/fase2/connection.json
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python automatizacion/tests/scoped_content_test.py
      - run: node automatizacion/tests/scoped-http.test.mjs
      - name: Inspeccionar bundle real del Worker sin publicar codigo ni datos
        if: steps.config.outputs.activar == 'false' && steps.config.outputs.sincronizar_meta == 'false'
        run: python automatizacion/scoped_content.py --inspect
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Verificar y aplicar únicamente la identidad autorizada HUB017
        if: steps.config.outputs.hub017_identity == 'true' && steps.config.outputs.activar == 'false' && steps.config.outputs.sincronizar_meta == 'false'
        run: |
          python automatizacion/tests/hub017_identity_test.py
          python automatizacion/hub017_identity.py
          node automatizacion/hub017_identity_e2e.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.config.outputs.hub017_identity == 'true'
        with:
          name: identidad-hub017-verificada
          path: |
            automatizacion/generated/fase2/hub017-identity-deploy.json
            automatizacion/generated/fase2/hub017-identity-cloud.json
          retention-days: 7
      - name: Comprobar token de Pagina y permisos Meta sin enviar mensajes
        run: node automatizacion/meta-account-check.mjs
        env:
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_APP_ID: ${{ vars.META_APP_ID }}
          META_TEST_SENDER_IDS: ${{ secrets.META_TEST_SENDER_IDS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permisos-meta-solo-lectura
          path: automatizacion/generated/fase2/meta-account-check.json
          retention-days: 7
      - name: Leer recibos privados del Worker sin enviar mensajes
        run: node automatizacion/meta-diagnostics.mjs
        env:
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Comprobar vigencia independiente de inventario 593 y feed sin IA ni escrituras
        run: node automatizacion/alex-catalog-e2e.mjs
      - name: Verificar presentacion privada del Worker vigente sin desplegar
        if: steps.config.outputs.verificar_presentacion == 'true' && steps.config.outputs.activar == 'false' && steps.config.outputs.sincronizar_meta == 'false'
        run: node automatizacion/marketplace-e2e.mjs
        env:
          PILOT_BASE_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          EXPECTED_RELEASE: ${{ steps.config.outputs.release_verificacion }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vigencia-comercial-593
          path: |
            automatizacion/generated/fase2/alex-live-catalog-check.json
            ${{ steps.config.outputs.verificar_presentacion == 'true' && 'automatizacion/generated/fase2/marketplace-cloud.json' || '' }}
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-meta-solo-lectura
          path: automatizacion/generated/fase2/meta-diagnostics.json
          retention-days: 7
      - name: Verificar URLs publicas y proteccion de acceso para App Review sin usar IA ni enviar mensajes
        run: node automatizacion/meta-review-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparacion-app-review-meta
          path: automatizacion/generated/fase2/meta-review-readiness.json
          retention-days: 7
  sincronizar_meta:
    needs: preparar
    if: github.ref == 'refs/heads/automatizacion/piloto-cloud-3sku-20261015' && needs.preparar.outputs.sincronizar_meta == 'true' && needs.preparar.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: conectatech-piloto-gratis
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automatizacion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python automatizacion/tests/deploy_test.py
      - name: Sincronizar solo META_VERIFY_TOKEN y comprobar desafio HTTPS
        run: python automatizacion/deploy_free.py --sync-meta-verify-token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacion-meta-token
          path: automatizacion/generated/fase2/meta-token-sync.json
          retention-days: 7
  desplegar:
    needs: preparar
    if: github.ref == 'refs/heads/automatizacion/piloto-cloud-3sku-20261015' && needs.preparar.outputs.activar == 'true' && needs.preparar.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: conectatech-piloto-gratis
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automatizacion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python automatizacion/tests/deploy_test.py
      - run: python automatizacion/tests/source_preservation_test.py
      - run: python automatizacion/tests/generic_receiver_guard_test.py
      - run: node automatizacion/tests/central-http.test.mjs
      - run: node automatizacion/tests/worker.test.mjs
      - run: node automatizacion/tests/live.test.mjs
      - run: node automatizacion/tests/messenger.test.mjs
      - run: node automatizacion/tests/messenger-closed-ingress.test.mjs
      - run: node automatizacion/tests/private-source-preflight.test.mjs
      - run: node automatizacion/tests/seller.test.mjs
      - run: node automatizacion/tests/alex.test.mjs
      - run: node automatizacion/tests/alex-upgrade.test.mjs
      - run: node automatizacion/tests/alex-commercial.test.mjs
      - run: node automatizacion/tests/alex-samsung.test.mjs
      - run: node automatizacion/tests/alex-objections.test.mjs
      - run: node automatizacion/tests/alex-catalog-selection.test.mjs
      - run: node automatizacion/tests/alex-ultra-conversation.test.mjs
      - run: python automatizacion/tests/central_593_test.py
      - run: node automatizacion/tests/central.test.mjs
      - run: node automatizacion/tests/marketplace.test.mjs
      - name: Confirmar fuente privada antes del unico despliegue
        if: needs.preparar.outputs.closed_ingress_only == 'true'
        run: node automatizacion/private-source-preflight.mjs --phase pre --report automatizacion/generated/fase2/private-source-pre.json
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - id: deploy
        run: python automatizacion/deploy_free.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_TEST_SENDER_IDS: ${{ secrets.META_TEST_SENDER_IDS }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ vars.META_APP_ID }}
          COMMERCIAL_ACTIONS_TOKEN: ${{ secrets.COMMERCIAL_ACTIONS_TOKEN }}
      - name: Confirmar fuente privada conservada tras el unico despliegue
        if: needs.preparar.outputs.closed_ingress_only == 'true'
        run: node automatizacion/private-source-preflight.mjs --phase post --expected-release "$GITHUB_SHA" --previous automatizacion/generated/fase2/private-source-pre.json --report automatizacion/generated/fase2/private-source-post.json
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Verificar piloto previo si el alcance no es la nueva conversación
        run: node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("automatizacion/activar-cloud.json")); if(!["conversation_flow","samsung_recovery","commercial_objections","central_source","marketplace_pilot"].includes(c.alex_validation)) await import("./automatizacion/e2e.mjs");'
        env:
          PILOT_BASE_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          REQUIRE_REAL_AI: 'true'
          EXPECTED_RELEASE: ${{ github.sha }}
      - name: Verificar receptor Messenger de desarrollo sin envios
        run: python automatizacion/run-messenger-with-tail.py
        env:
          MESSENGER_E2E_SCOPE: ${{ needs.preparar.outputs.closed_ingress_only == 'true' && 'closed_ingress_only' || '' }}
          EXPECTED_RELEASE: ${{ github.sha }}
          PRIVATE_SOURCE_PREFLIGHT: ${{ needs.preparar.outputs.closed_ingress_only == 'true' && 'automatizacion/generated/fase2/private-source-pre.json' || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_BASE_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      - name: Leer recibos del Worker despues de verificar HTTPS
        run: node automatizacion/meta-diagnostics.mjs
        env:
          CLOUDFLARE_PILOT_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Habilitar solo probadores configurados y verificar proteccion HTTPS
        run: node automatizacion/seller-activate.mjs
        env:
          CLOUDFLARE_PILOT_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Verificar Alex real con alcance documentado de conversación o regresión
        run: node automatizacion/alex-validate.mjs
        env:
          PILOT_BASE_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          EXPECTED_RELEASE: ${{ github.sha }}
      - name: Comprobar calidad de conversación privada y dos turnos de IA como máximo; sin Graph sends
        run: node automatizacion/alex-ultra-e2e.mjs
        env:
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          EXPECTED_RELEASE: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-cloud-piloto
          path: automatizacion/generated/fase2/
          retention-days: 7
