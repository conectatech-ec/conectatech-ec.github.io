name: Activar piloto cloud gratuito
on:
  push:
    branches: ['automatizacion/piloto-cloud-3sku-20261015']
    paths: ['automatizacion/activar-cloud.json', '.github/workflows/comercial-cloud.yml']
permissions:
  contents: read
concurrency:
  group: comercial-cloud-piloto
  cancel-in-progress: false
jobs:
  preparar:
    if: github.ref == 'refs/heads/automatizacion/piloto-cloud-3sku-20261015'
    environment: conectatech-piloto-gratis
    runs-on: ubuntu-latest
    outputs:
      activar: ${{ steps.config.outputs.activar }}
      sincronizar_meta: ${{ steps.config.outputs.sincronizar_meta }}
      ready: ${{ steps.conexion.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automatizacion
      - id: config
        run: python -c 'import json,os; c=json.load(open("automatizacion/activar-cloud.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("activar="+str(c["activar"]).lower()+"\nsincronizar_meta="+str(c.get("sincronizar_meta_verify_token",False)).lower()+"\n")'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer configuracion del Worker, recepcion Meta y estado de logs sin modificar recursos
        id: conexion
        run: python automatizacion/deploy_free.py --check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estado-conexion-cloud
          path: automatizacion/generated/fase2/connection.json
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar token de Pagina y permisos Meta sin enviar mensajes
        run: node automatizacion/meta-account-check.mjs
        env:
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_APP_ID: ${{ vars.META_APP_ID }}
          META_TEST_SENDER_IDS: ${{ secrets.META_TEST_SENDER_IDS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permisos-meta-solo-lectura
          path: automatizacion/generated/fase2/meta-account-check.json
          retention-days: 7
      - name: Leer recibos privados del Worker sin enviar mensajes
        run: node automatizacion/meta-diagnostics.mjs
        env:
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-meta-solo-lectura
          path: automatizacion/generated/fase2/meta-diagnostics.json
          retention-days: 7
      - name: Verificar URLs publicas y proteccion de acceso para App Review sin usar IA ni enviar mensajes
        run: node automatizacion/meta-review-readiness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preparacion-app-review-meta
          path: automatizacion/generated/fase2/meta-review-readiness.json
          retention-days: 7
  sincronizar_meta:
    needs: preparar
    if: github.ref == 'refs/heads/automatizacion/piloto-cloud-3sku-20261015' && needs.preparar.outputs.sincronizar_meta == 'true' && needs.preparar.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: conectatech-piloto-gratis
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automatizacion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python automatizacion/tests/deploy_test.py
      - name: Sincronizar solo META_VERIFY_TOKEN y comprobar desafio HTTPS
        run: python automatizacion/deploy_free.py --sync-meta-verify-token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacion-meta-token
          path: automatizacion/generated/fase2/meta-token-sync.json
          retention-days: 7
  desplegar:
    needs: preparar
    if: github.ref == 'refs/heads/automatizacion/piloto-cloud-3sku-20261015' && needs.preparar.outputs.activar == 'true' && needs.preparar.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: conectatech-piloto-gratis
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: automatizacion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python automatizacion/tests/deploy_test.py
      - run: node automatizacion/tests/worker.test.mjs
      - run: node automatizacion/tests/live.test.mjs
      - run: node automatizacion/tests/messenger.test.mjs
      - run: node automatizacion/tests/seller.test.mjs
      - run: node automatizacion/tests/alex.test.mjs
      - run: node automatizacion/tests/alex-upgrade.test.mjs
      - run: node automatizacion/tests/alex-commercial.test.mjs
      - id: deploy
        run: python automatizacion/deploy_free.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PILOT_URL: ${{ vars.CLOUDFLARE_PILOT_URL }}
          CF_FREE_ONLY_CONFIRMED: ${{ vars.CF_FREE_ONLY_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_TEST_SENDER_IDS: ${{ secrets.META_TEST_SENDER_IDS }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ vars.META_APP_ID }}
      - name: Verificar piloto previo si el alcance no es la nueva conversación
        run: node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("automatizacion/activar-cloud.json")); if(c.alex_validation!=="conversation_flow") await import("./automatizacion/e2e.mjs");'
        env:
          PILOT_BASE_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          REQUIRE_REAL_AI: 'true'
          EXPECTED_RELEASE: ${{ github.sha }}
      - name: Verificar receptor Messenger de desarrollo sin envios
        run: python automatizacion/run-messenger-with-tail.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PILOT_BASE_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      - name: Leer recibos del Worker despues de verificar HTTPS
        run: node automatizacion/meta-diagnostics.mjs
        env:
          CLOUDFLARE_PILOT_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Habilitar solo probadores configurados y verificar proteccion HTTPS
        run: node automatizacion/seller-activate.mjs
        env:
          CLOUDFLARE_PILOT_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - name: Verificar Alex real con alcance documentado de conversación o regresión
        run: node automatizacion/alex-validate.mjs
        env:
          PILOT_BASE_URL: ${{ steps.deploy.outputs.url }}
          PILOT_TOKEN: ${{ secrets.PILOT_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-cloud-piloto
          path: automatizacion/generated/fase2/
          retention-days: 7
