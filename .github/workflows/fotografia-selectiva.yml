name: Verificar fotografía selectiva
on:
  push:
    branches: [main, 'fotografia/publicar-*']
    paths:
      - 'importacion/fotografia-publicada/**'
      - '.github/workflows/fotografia-selectiva.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fotografia-selectiva-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fotografia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verificar archivos y publicación real sin modificar datos comerciales
        shell: python
        env:
          PHOTO_REF: ${{ github.ref }}
          PHOTO_SHA: ${{ github.sha }}
        run: |
          import json, os, re, hashlib, time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          origin = 'https://conectatech-ec.github.io'
          raw = 'https://raw.githubusercontent.com/conectatech-ec/conectatech-ec.github.io/' + os.environ['PHOTO_SHA']
          def get(url):
              with urlopen(Request(url, headers={'User-Agent':'CONECTATECH-fotografia-selectiva','Cache-Control':'no-cache'}), timeout=30) as r:
                  if r.status != 200: raise RuntimeError('HTTP ' + str(r.status))
                  return r.read()
          record = json.loads(get(raw + '/importacion/fotografia-publicada/PROT003.json'))
          assert record['sku'] == 'PROT003' and record['aprobado_por_propietario'] is True
          photo = record['imagenProfesional']
          assert photo['sha256_original'] == record['maestro_aprobado_sha256'] == 'ec2a21e15462f82bed2c87963ee69e46fc961ad998613a9176be5341f3393f53'
          versions = []
          for size, v in photo['versiones'].items():
              assert v['url'].startswith('/imagenes/prot003/')
              payload = get(origin + v['url'])
              assert hashlib.sha256(payload).hexdigest() == v['sha256'], size
              versions.append({'tamano':size,'http':200,'sha256':v['sha256']})
          result = {'sku':'PROT003','archivos_verificados':versions,'publicacion_activa':False,'datos_comerciales_modificados':False}
          if os.environ['PHOTO_REF'] == 'refs/heads/main':
              page_url = origin + '/productos/prot003-protectores-de-silicon-animados-para-cables/'
              for attempt in range(120):
                  try:
                      page = get(page_url).decode()
                      catalog = get(origin + '/').decode()
                      ref = re.search(r'src="(/assets/catalogo-publicado[.]js[?]v=[^"]+)"', catalog)
                      assert ref, 'Referencia pública del catálogo'
                      metadata = get(origin + ref[1]).decode()
                      match = re.search(r'window[.]CONECTATECH_CATALOGO=(.*);', metadata, re.S)
                      row = json.loads(match[1])['productos']['PROT003']
                      assert photo['versiones']['1200']['url'] in page
                      assert row['imagen']['src'] == photo['versiones']['1200']['url']
                      assert 'PROT003' in page
                      result.update(publicacion_activa=True,url=page_url,sha256_ficha=hashlib.sha256(page.encode()).hexdigest(),fecha=datetime.now(timezone.utc).isoformat())
                      break
                  except Exception:
                      if attempt == 119: raise
                      time.sleep(5)
          print('RESULTADO_FOTOGRAFICO=' + json.dumps(result, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('PROT003: archivos verificados. Publicación activa: ' + str(result['publicacion_activa']) + '\\n')

  secundarias:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verificar secundarias publicadas y conservar portadas
        shell: python
        env:
          PHOTO_REF: ${{ github.ref }}
          PHOTO_SHA: ${{ github.sha }}
        run: |
          import json, os, hashlib, time, subprocess
          from urllib.request import Request, urlopen
          from datetime import datetime, timezone
          origin='https://conectatech-ec.github.io'
          raw='https://raw.githubusercontent.com/conectatech-ec/conectatech-ec.github.io/'+os.environ['PHOTO_SHA']
          def get(url):
              with urlopen(Request(url,headers={'User-Agent':'CONECTATECH-secundarias','Cache-Control':'no-cache'}),timeout=30) as r:
                  assert r.status==200
                  return r.read()
          record=json.loads(get(raw+'/importacion/fotografia-publicada/secundarias-20261026.json'))
          paths={'HUB011':'hub011-hub-usb-11-en-1-fast','AUDI095':'audi095-audifonos-deportivos-thinkplus-x15pro'}
          result={'publicacion_activa':False,'productos':[]}
          published=os.environ['PHOTO_REF']=='refs/heads/main'
          for attempt in range(300 if published else 1):
              try:
                  rows=[]
                  for sku,row in record['productos'].items():
                      assert sku in paths and row['sku']==sku and row['revisado_visual'] is True
                      prefix='/imagenes/'+sku.lower()+'/'
                      files=[]
                      for view in row['vistas']:
                          assert view['posicion']>1 and view['contiene_caja'] is False
                          for v in [view['maestro_webp'],*view['versiones'].values()]:
                              assert v['url'].startswith(prefix) and '..' not in v['url']
                              data=get((origin if published else raw)+v['url'])
                              assert hashlib.sha256(data).hexdigest()==v['sha256']
                              files.append({'url':v['url'],'sha256':v['sha256'],'http':200})
                      entry={'sku':sku,'vistas':len(row['vistas']),'archivos_verificados':files}
                      if published:
                          url=origin+'/productos/'+paths[sku]+'/'
                          page=get(url).decode()
                          assert hashlib.sha256(get(origin+prefix+sku+'-01.webp')).hexdigest()==row['portada_sha256']
                          for view in row['vistas']:
                              assert view['versiones']['1200']['url'] in page and view['versiones']['300']['url'] in page
                          for width in [1280,390]:
                              dom=subprocess.check_output(['google-chrome','--headless','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--window-size='+str(width)+',900','--virtual-time-budget=10000','--dump-dom',url+'?fotografia=secundarias-20261026'],timeout=90,stderr=subprocess.DEVNULL).decode()
                              for view in row['vistas']: assert view['versiones']['300']['url'] in dom
                          entry.update(url=url,portada_conservada=True,chromium=[1280,390])
                      rows.append(entry)
                  result.update(productos=rows,publicacion_activa=published)
                  if published: result['fecha_primera_verificacion']=datetime.now(timezone.utc).isoformat()
                  break
              except Exception:
                  if not published or attempt==299: raise
                  time.sleep(5)
          print('RESULTADO_SECUNDARIAS='+json.dumps(result,ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Secundarias HUB011/AUDI095: '+str(result['publicacion_activa'])+'; portadas conservadas.\\n')

