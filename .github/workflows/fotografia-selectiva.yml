              photo=row['imagenProfesional'];assert row['revisado_visual'] and row['maestro_reutilizado_sin_regenerar'] and all(row['qa_geometria'].values())
              assert photo['original']==row['maestro_anterior']['url'] and photo['sha256_original']==row['maestro_anterior']['sha256']
              files=[row['maestro_anterior'],*row['versiones_anteriores'].values(),*photo['versiones'].values()]
              for kept in row['mantener_vistas']:files.extend([{'url':kept['original'],'sha256':kept['sha256_original']},*kept['versiones'].values()])
              for v in files:
                  assert v['url'].startswith('/imagenes/'+s.lower()+'/') and '..' not in v['url']
                  if v['url'] not in cache:cache[v['url']]=hashlib.sha256(get((origin if published else raw)+v['url'])).hexdigest()
                  assert cache[v['url']]==v['sha256']
              if published:
                  page=get(origin+row['pagina']).decode();assert photo['versiones']['1200']['url'] in page and photo['versiones']['300']['url'] in page
              results.append({'sku':s,'archivos':len(files),'maestro_integro_conservado':True})
          if published:
              gallery=get(origin+'/revision/fotografia-reencuadres-masivos-20261029-26/').decode();assert gallery.count('<article')==28 and gallery.count('<img ')==56
              joint=get(origin+record['galeria_conjunta']).decode();assert joint.count('<article')==58 and joint.count('<img ')==116
          print('RESULTADO_DIRECCION_26='+json.dumps({'publicacion_activa':published,'fecha':datetime.now(timezone.utc).isoformat(),'archivos_unicos':len(cache),'productos':results},ensure_ascii=False))
      - name: Comprobar veintiocho fichas y galería en móvil y escritorio
        if: github.ref == 'refs/heads/main'
        env:
          PHOTO_SHA: ${{ github.sha }}
          PHOTO_PUBLIC: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/foto-qa26"
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/foto-qa26" playwright@1.51.1
          curl --fail --silent --show-error "https://raw.githubusercontent.com/conectatech-ec/conectatech-ec.github.io/$PHOTO_SHA/scripts/fotografia-reencuadres-26-qa.cjs" -o "$RUNNER_TEMP/foto-qa26/qa.cjs"
          NODE_PATH="$RUNNER_TEMP/foto-qa26/node_modules" node "$RUNNER_TEMP/foto-qa26/qa.cjs"
