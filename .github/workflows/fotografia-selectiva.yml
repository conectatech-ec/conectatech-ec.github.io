              assert.equal(catalog.cover,row.portada_anterior.url);assert.equal(catalog.metaCover,catalog.cover);assert(!catalog.overflow);
              if(process.env.PHOTO_REF==='refs/heads/main'&&manifest.publicacion_verificada){assert(Date.parse(catalog.date)>=Date.parse(manifest.fecha_primera_verificacion_publica));assert(catalog.position>0);}
              out.push({sku:'ADAP069',width,...data,galeria_imagenes:3,catalogo:catalog});await page.close();
            }
