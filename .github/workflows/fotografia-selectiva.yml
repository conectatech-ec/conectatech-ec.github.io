name: Verificar fotografía selectiva
on:
  push:
    branches: [main, 'fotografia/publicar-*']
    paths:
      - 'importacion/fotografia-publicada/**'
      - '.github/workflows/fotografia-selectiva.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fotografia-selectiva-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fotografia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verificar archivos y publicación real sin modificar datos comerciales
        shell: python
        env:
          PHOTO_REF: ${{ github.ref }}
          PHOTO_SHA: ${{ github.sha }}
        run: |
          import json, os, re, hashlib, time
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          origin = 'https://conectatech-ec.github.io'
          raw = 'https://raw.githubusercontent.com/conectatech-ec/conectatech-ec.github.io/' + os.environ['PHOTO_SHA']
          def get(url):
              with urlopen(Request(url, headers={'User-Agent':'CONECTATECH-fotografia-selectiva','Cache-Control':'no-cache'}), timeout=30) as r:
                  if r.status != 200: raise RuntimeError('HTTP ' + str(r.status))
                  return r.read()
          record = json.loads(get(raw + '/importacion/fotografia-publicada/PROT003.json'))
          assert record['sku'] == 'PROT003' and record['aprobado_por_propietario'] is True
          photo = record['imagenProfesional']
          assert photo['sha256_original'] == record['maestro_aprobado_sha256'] == 'ec2a21e15462f82bed2c87963ee69e46fc961ad998613a9176be5341f3393f53'
          versions = []
          for size, v in photo['versiones'].items():
              assert v['url'].startswith('/imagenes/prot003/')
              payload = get(origin + v['url'])
              assert hashlib.sha256(payload).hexdigest() == v['sha256'], size
              versions.append({'tamano':size,'http':200,'sha256':v['sha256']})
          result = {'sku':'PROT003','archivos_verificados':versions,'publicacion_activa':False,'datos_comerciales_modificados':False}
          if os.environ['PHOTO_REF'] == 'refs/heads/main':
              page_url = origin + '/productos/prot003-protectores-de-silicon-animados-para-cables/'
              for attempt in range(120):
                  try:
                      page = get(page_url).decode()
                      catalog = get(origin + '/').decode()
                      ref = re.search(r'src="(/assets/catalogo-publicado[.]js[?]v=[^"]+)"', catalog)
                      assert ref, 'Referencia pública del catálogo'
                      metadata = get(origin + ref[1]).decode()
                      match = re.search(r'window[.]CONECTATECH_CATALOGO=(.*);', metadata, re.S)
                      row = json.loads(match[1])['productos']['PROT003']
                      assert photo['versiones']['1200']['url'] in page
                      assert row['imagen']['src'] == photo['versiones']['1200']['url']
                      assert 'PROT003' in page
                      result.update(publicacion_activa=True,url=page_url,sha256_ficha=hashlib.sha256(page.encode()).hexdigest(),fecha=datetime.now(timezone.utc).isoformat())
                      break
                  except Exception:
                      if attempt == 119: raise
                      time.sleep(5)
          print('RESULTADO_FOTOGRAFICO=' + json.dumps(result, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('PROT003: archivos verificados. Publicación activa: ' + str(result['publicacion_activa']) + '\\n')
