                              files.append({'url':v['url'],'sha256':v['sha256'],'http':200})
                      entry={'sku':sku,'vistas':len(row['vistas']),'archivos_verificados':files}
                      if published:
                          url=origin+'/productos/'+paths[sku]+'/'
                          page=get(url).decode()
