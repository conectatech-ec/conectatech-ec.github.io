name: Generar fichas SEO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'seo-contenido.json'
      - 'scripts/generar-seo.cjs'
permissions:
  contents: write
concurrency:
  group: seo-generacion-main
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sincronizar rama y generar páginas
        run: |
          git pull --ff-only origin main
          node scripts/generar-seo.cjs
      - name: Publicar resultados con reintentos seguros
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/generar-seo.cjs
            git add index.html productos sitemap.xml seo-pages.json
            if git diff --cached --quiet; then
              echo "No hay cambios pendientes"
              exit 0
            fi
            git commit -m "Actualizar automáticamente páginas SEO"
            if git push origin HEAD:main; then
              echo "Publicación completada"
              exit 0
            fi
            echo "Otro proceso actualizó main; reintentando desde versión reciente ($intento/5)"
            sleep 3
          done
          echo "No se pudo publicar tras 5 intentos"
          exit 1
