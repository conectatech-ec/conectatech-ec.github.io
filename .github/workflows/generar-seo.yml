name: Generar fichas SEO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'seo-contenido.json'
      - 'scripts/generar-seo.cjs'
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar páginas y sitemap
        run: node scripts/generar-seo.cjs
      - name: Publicar archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos sitemap.xml seo-pages.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar automáticamente páginas SEO"
            git push
          fi
