name: QA aislado - capa tematica SIGNATURE
on:
  push:
    branches: ['banners/campanas-20261103']
    paths:
      - 'banner-factory/revision-premium/signature-v2-20261018/tema_campana.py'
      - 'banner-factory/revision-premium/signature-v2-20261018/campana-tematica.json'
      - 'banner-factory/revision-premium/signature-v2-20261018/tests/test*.py'
      - 'banner-factory/revision-premium/signature-v2-20261018/assets/campaigns/**'
      - 'banner-factory/revision-premium/signature-v2-20261018/tests/benchmark_tema_campana.py'
      - '.github/workflows/qa-campana-signature.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-campana-signature-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validar:
    if: github.repository == 'conectatech-ec/conectatech-ec.github.io' && github.ref == 'refs/heads/banners/campanas-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /banner-factory/revision-premium/signature-v2-20261018/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia ya utilizada por la fabrica
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Pruebas de fechas, geometria, fidelidad y cache
        run: python -m unittest discover -s 'banner-factory/revision-premium/signature-v2-20261018/tests' -p 'test*.py' -v
      - name: Medicion sintetica de la capa
        run: python 'banner-factory/revision-premium/signature-v2-20261018/tests/benchmark_tema_campana.py'

  recuperar-fotos-publicas:
    if: github.repository == 'conectatech-ec/conectatech-ec.github.io' && github.ref == 'refs/heads/banners/campanas-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sku: [TELF023, TABL004]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Recuperar solo imagen ya publica y verificar su maestro
        env:
          PHOTO_SKU: ${{ matrix.sku }}
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,os,urllib.request
          from PIL import Image
          sources={
            "TELF023":("imagenes/telf023/original-bfbe080b08b2a2a3.png","bfbe080b08b2a2a3fbadfde5d6223f2d40d6598b10729d60444192794240ce0c"),
            "TABL004":("imagenes/tabl004/original-78ee8f53f2b962e2.png","78ee8f53f2b962e242bc4be7d7feb6308f577f926364d6b543347de412faba5c")
          }
          sku=os.environ["PHOTO_SKU"];path,expected=sources[sku]
          url="https://raw.githubusercontent.com/conectatech-ec/conectatech-ec.github.io/f71ae890dca402d6d5a91beb28c232ff39dce712/"+path
          with urllib.request.urlopen(url,timeout=45) as response:data=response.read()
          actual=hashlib.sha256(data).hexdigest()
          if actual!=expected:raise RuntimeError("Maestro publico no coincide")
          with Image.open(io.BytesIO(data)) as im:
            native=im.size
            im=im.convert("RGBA");im.thumbnail((900,900),Image.Resampling.LANCZOS)
            b=io.BytesIO();im.save(b,format="PNG",optimize=True)
            payload={"sku":sku,"source_sha256":actual,"source_public_path":path,"native_size":native,"transfer_size":im.size,"format":"PNG","png_base64":base64.b64encode(b.getvalue()).decode()}
          # Solo pixeles ya publicados en la web; nunca se accede a Drive ni a credenciales.
          print("CT_PUBLIC_PHOTO_JSON="+json.dumps(payload,separators=(",",":")))
          PY

  verificar-identidad-drive-existente:
    if: github.repository == 'conectatech-ec/conectatech-ec.github.io' && github.ref == 'refs/heads/banners/campanas-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Probar solo lectura con identidad documentada del motor original
        env:
          CONECTATECH_DRIVE_ACCESS_TOKEN: ${{ secrets.CONECTATECH_DRIVE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get("CONECTATECH_DRIVE_ACCESS_TOKEN","").strip()
          if not token:
            print("CT_DRIVE_DIAGNOSTICO="+json.dumps({"estado":"IDENTIDAD_DOCUMENTADA_NO_CONFIGURADA_EN_ACTIONS","solicitudes_drive":0}))
            raise SystemExit(0)
          def get(path):
            req=urllib.request.Request("https://www.googleapis.com/drive/v3/"+path,headers={"Authorization":"Bearer "+token})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          try:
            identity=get("about?fields=user(emailAddress)")
            owner=identity.get("user",{}).get("emailAddress","").lower()
            if owner!="conectatech.ecu@gmail.com":
              print("CT_DRIVE_DIAGNOSTICO="+json.dumps({"estado":"IDENTIDAD_NO_CORRESPONDE_A_CUENTA_EMPRESARIAL","escrituras":0}))
              raise SystemExit(0)
            ids=["1kCbsenZas7F_Jq0Nvy3kbLQvHg1BmgUO","1ReRNdApH5smbaQmhIcL1i2sKxumle0LI","1jm2Q5S7fSnGqwiJO6PKlb6iAGM2xKNzi","1iNNrD3y5cBJAQoFN7LQJzYxCid3TvDs6"]
            files=[get("files/"+i+"?fields=id,mimeType,size,capabilities(canEdit)&supportsAllDrives=true") for i in ids]
            print("CT_DRIVE_DIAGNOSTICO="+json.dumps({"estado":"IDENTIDAD_EMPRESARIAL_VALIDADA","pilotos_accesibles":len(files),"pilotos_editables":sum(f.get("capabilities",{}).get("canEdit",False) for f in files),"escrituras":0}))
          except urllib.error.HTTPError as e:
            try:body=json.loads(e.read());reason=body.get("error",{}).get("errors",[{}])[0].get("reason","sin_reason")
            except Exception:reason="respuesta_no_json"
            print("CT_DRIVE_DIAGNOSTICO="+json.dumps({"estado":"ERROR_HTTP_IDENTIDAD_EXISTENTE","http":e.code,"reason":reason,"escrituras":0}))
          PY
