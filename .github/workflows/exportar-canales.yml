name: Exportar catálogo multicanal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*meta*.cjs'
      - 'scripts/exportar-canales.cjs'
      - 'scripts/test-exportar-canales.cjs'
      - 'scripts/editorial-fotografia-efectiva.cjs'
      - 'scripts/fotografia-direccion.cjs'
      - 'assets/editorial-titulos*.js'
      - '.github/workflows/exportar-canales.yml'
  workflow_run:
    workflows:
      - 'Publicar corte comercial 593 validado'
      - 'Publicar stock, fecha y feeds comerciales desde 593 validado'
      - 'Sincronizar catalogo desde 593'
      - 'Producir catálogo profesional por SKU'
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'seo-contenido.json'
      - 'importacion/editorial/publicados.json'
      - 'assets/editorial-titulos*.js'
      - 'scripts/editorial-fotografia-efectiva.cjs'
      - 'scripts/fotografia-direccion.cjs'
      - 'importacion/fotografia-publicada/**'
      - 'scripts/exportar-canales.cjs'
      - 'scripts/categorias-meta-web.cjs'
      - 'scripts/sincronizar-conjuntos-meta.cjs'
      - 'scripts/prioridad-comercial-meta.cjs'
      - 'scripts/reordenar-seis-colecciones-meta.cjs'
      - '.github/workflows/exportar-canales.yml'
      - 'scripts/validar-exportacion-593.cjs'
      - 'datos-593/estado-ultimo-corte.json'
      - 'datos-593/inventario-publico.csv'
      - 'seo-pages.json'
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('validacion-meta-{0}', github.event.pull_request.number) || 'exportacion-canales-main' }}
  cancel-in-progress: false
jobs:
  comprobar-acceso-meta:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar nombres y portadas importados mediante GET
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: 'v26.0'
          META_VERIFY_READ_ONLY: 'true'
        run: |
          node - <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {Graph}=require('./scripts/sincronizar-conjuntos-meta.cjs');
          const {verifyPostImport}=require('./scripts/verificar-postimport-meta.cjs');
          (async()=>{
            const result={schema:'conectatech.meta_import_and_editorial_read_only.v1',read_only:true,write_requests:0,customer_messages:0,requests:0};
            try{
              const csv=fs.readFileSync('exportaciones/meta-catalogo-piloto.csv','utf8');
              const plan=JSON.parse(fs.readFileSync('exportaciones/meta-conjuntos-web.json','utf8'));
              const checkpoint=JSON.parse(fs.readFileSync('reportes/integracion-whatsapp/ultima-importacion.json','utf8'));
              if(!/^\d+$/.test(String(plan.catalog_id))||String(checkpoint.catalog_id)!==String(plan.catalog_id)||!/^\d+$/.test(String(checkpoint.feed_id)))throw Error('PLAN_INVALID');
              if(!process.env.META_ACCESS_TOKEN)throw Error('NO_ACCESS');
              const transport=new Graph({token:process.env.META_ACCESS_TOKEN,version:'v26.0'});
              const api={request:async(method,target,params)=>{
                if(method!=='GET'||result.requests>=20)throw Error('READ_BUDGET');
                result.requests++;return transport.request(method,target,params);
              }};
              const digest=crypto.createHash('sha256').update(csv).digest('hex');
              result.expected_feed_sha256=digest;result.expected_items=plan.productos_meta;
              const uploads=await api.request('GET',checkpoint.feed_id+'/uploads',{fields:'id,filename,end_time,error_count,num_invalid_items,num_persisted_items',limit:100});
              if(!Array.isArray(uploads.data))throw Error('IMPORT_RESPONSE_INVALID');
              const matches=uploads.data.filter(u=>String(u.filename||'').endsWith('ct-'+digest+'.csv'));
              result.target_uploads_found=matches.length;
              result.observed_pending_uploads=uploads.data.filter(u=>!u.end_time&&!u.error_count).length;
              const upload=matches.length===1?matches[0]:null;
              result.import_complete=!!upload?.end_time;
              result.import_error_count=Number.isSafeInteger(upload?.error_count)?upload.error_count:null;
              result.invalid_items=Number.isSafeInteger(upload?.num_invalid_items)?upload.num_invalid_items:null;
              result.persisted_items=Number.isSafeInteger(upload?.num_persisted_items)?upload.num_persisted_items:null;
              result.import_verified=!!upload?.end_time&&result.import_error_count===0&&result.invalid_items===0&&result.persisted_items>=plan.productos_meta;
              if(result.import_verified){
                result.postimport=await verifyPostImport({csv,api,catalogId:String(plan.catalog_id),maxRequests:19});
                result.state='IMPORT_VERIFIED_EDITORIAL_READ_COMPLETE';
              }else result.state='IMPORT_STATUS_READ_ONLY_PENDING_OR_UNKNOWN';
            }catch{result.state='READ_ONLY_STATUS_UNAVAILABLE';}
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'meta-postimport-read-only.json'),JSON.stringify(result,null,2)+'\n');
            console.log('META_IMPORT_EDITORIAL_READ_ONLY '+JSON.stringify(result));
          })().catch(()=>{console.error('META_READ_ONLY_CHECK_FAILED');process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-postimport-read-only
          path: ${{ runner.temp }}/meta-postimport-read-only.json
          retention-days: 3
          if-no-files-found: error
  validar-integracion:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/test-meta-web.cjs
          node scripts/test-prioridad-meta.cjs
          node scripts/test-reordenar-meta.cjs
          node scripts/test-exportar-canales.cjs
          node scripts/test-validar-exportacion-593.cjs
          node scripts/verificar-paridad-meta-web.cjs
          node scripts/test-verificar-paridad-meta-web.cjs
          node scripts/test-verificar-postimport-meta.cjs
  exportar:
    timeout-minutes: 50
    # También se ejecuta tras publicaciones de bots 593: sus pushes no disparan otros workflows.
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar archivos CSV
        run: |
          node scripts/test-meta-web.cjs
          node scripts/test-prioridad-meta.cjs
          node scripts/test-reordenar-meta.cjs
          node scripts/test-validar-exportacion-593.cjs
          node scripts/test-exportar-canales.cjs
          node scripts/exportar-canales.cjs
      - name: Guardar exportaciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/exportar-canales.cjs
            git add exportaciones/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualizar exportaciones multicanal"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Sincronizar fuente existente y conjuntos de Meta
        env:
          META_SYNC_ENABLED: 'true'
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: 'v26.0'
        run: node scripts/sincronizar-conjuntos-meta.cjs
      - name: Ejecutar una vez la recreación de seis conjuntos autorizada por Dirección
        env:
          META_RECREATE_SIX_ENABLED: 'true'
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: 'v26.0'
        run: node scripts/reordenar-seis-colecciones-meta.cjs --apply
      - name: Conservar puntos de reanudación de Meta
        if: always()
        run: |
          if [ ! -f work/auto-meta/importacion.json ] && [ ! -f work/auto-meta/reordenacion.json ]; then exit 0; fi
          mkdir -p /tmp/conectatech-meta-puntos
          if [ -f work/auto-meta/importacion.json ]; then cp work/auto-meta/importacion.json /tmp/conectatech-meta-puntos/importacion.json; fi
          if [ -f work/auto-meta/reordenacion.json ]; then cp work/auto-meta/reordenacion.json /tmp/conectatech-meta-puntos/reordenacion.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reportes/integracion-whatsapp
            if [ -f /tmp/conectatech-meta-puntos/importacion.json ]; then
              cp /tmp/conectatech-meta-puntos/importacion.json reportes/integracion-whatsapp/ultima-importacion.json
              git add reportes/integracion-whatsapp/ultima-importacion.json
            fi
            if [ -f /tmp/conectatech-meta-puntos/reordenacion.json ]; then
              cp /tmp/conectatech-meta-puntos/reordenacion.json reportes/integracion-whatsapp/resultado-reordenar-seis-colecciones.json
              git add reportes/integracion-whatsapp/resultado-reordenar-seis-colecciones.json
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Conservar referencia de importación Meta para reanudación"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Conservar resultado verificable de Meta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-catalogo-meta
          path: |
            work/auto-meta/resultado.json
            work/auto-meta/reordenacion.json
          retention-days: 7
          if-no-files-found: warn

