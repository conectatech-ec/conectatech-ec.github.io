name: Exportar catálogo multicanal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*meta*.cjs'
      - 'scripts/exportar-canales.cjs'
      - 'scripts/test-exportar-canales.cjs'
      - '.github/workflows/exportar-canales.yml'
  workflow_run:
    workflows:
      - 'Publicar corte comercial 593 validado'
      - 'Publicar stock, fecha y feeds comerciales desde 593 validado'
      - 'Sincronizar catalogo desde 593'
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'seo-contenido.json'
      - 'scripts/exportar-canales.cjs'
      - 'scripts/categorias-meta-web.cjs'
      - 'scripts/sincronizar-conjuntos-meta.cjs'
      - '.github/workflows/exportar-canales.yml'
      - 'scripts/validar-exportacion-593.cjs'
      - 'datos-593/estado-ultimo-corte.json'
      - 'datos-593/inventario-publico.csv'
      - 'seo-pages.json'
permissions:
  contents: write
concurrency:
  group: exportacion-canales-main
  cancel-in-progress: false
jobs:
  comprobar-acceso-meta:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar credencial existente sin modificar activos
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          node - <<'JS'
          const fs=require('fs'),{Graph}=require('./scripts/sincronizar-conjuntos-meta.cjs');
          (async()=>{
            let result={estado:'SIN_CREDENCIAL_META_DISPONIBLE_EN_ACTIONS',solo_lectura:true};
            if(process.env.META_ACCESS_TOKEN){
              try{
                const api=new Graph({token:process.env.META_ACCESS_TOKEN,version:'v26.0'});
                const catalog=await api.request('GET','1036301566100990',{fields:'id,name'});
                const sets=await api.list('1036301566100990/product_sets','id,name,product_count,ordering_info');
                const example=sets.find(s=>s.name==='CONECTATECH | TABLETS');
                const tablets=example?await api.list(example.id+'/products','id,retailer_id'):[];
                console.log('PRIORIDAD_META: '+JSON.stringify({sets,tablets}));
                const feeds=await api.list('1036301566100990/product_feeds','id,name,schedule');
                const uploads=[];
                for(const f of feeds.filter(f=>f.schedule?.url==='https://conectatech-ec.github.io/exportaciones/meta-catalogo-piloto.csv')){
                  const items=await api.list(f.id+'/uploads','id,filename,start_time,end_time,error_count,num_invalid_items,num_persisted_items');
                  uploads.push({feed_id:f.id,cargas:items.slice(0,5).map(u=>({id:u.id,archivo_hash:String(u.filename||'').match(/ct-[a-f0-9]{64}/)?.[0]||'otro_nombre',inicio:u.start_time,fin:u.end_time,errores:u.error_count,invalidos:u.num_invalid_items,persistidos:u.num_persisted_items}))});
                }
                const products=await api.list('1036301566100990/products','retailer_id,custom_label_0,availability');
                const labels={};for(const p of products){const k=p.custom_label_0||'(sin etiqueta)';labels[k]=(labels[k]||0)+1;}
                let owner;try{owner=await api.request('GET','1036301566100990',{fields:'id,business{id,name},owner_business{id,name}'});}catch{owner={estado:'PROPIEDAD_NO_CONSULTABLE_CON_ESTE_PERMISO'};}
                result={estado:'CREDENCIAL_META_REUTILIZABLE',solo_lectura:true,catalogo:catalog,propiedad:owner,conjuntos:sets,importaciones:uploads,productos_leidos:products.length,disponibles:products.filter(p=>String(p.availability).replace(/_/g,' ')==='in stock').length,agotados:products.filter(p=>String(p.availability).replace(/_/g,' ')==='out of stock').length,etiquetas:labels};
              }catch{
                result={estado:'CREDENCIAL_EXISTENTE_SIN_ACCESO_VERIFICADO',solo_lectura:true};
              }
            }
            fs.mkdirSync('work/auto-meta',{recursive:true});
            fs.writeFileSync('work/auto-meta/acceso-meta.json',JSON.stringify(result,null,2));
            console.log('COMPROBACION_META: '+JSON.stringify(result));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nAcceso Meta (solo lectura): '+result.estado+'\n');
          })().catch(()=>{console.error('No se pudo completar la comprobación de acceso');process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: comprobacion-acceso-meta
          path: work/auto-meta/acceso-meta.json
          retention-days: 7
  validar-integracion:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/test-meta-web.cjs
          node scripts/test-exportar-canales.cjs
          node scripts/test-validar-exportacion-593.cjs
  exportar:
    timeout-minutes: 50
    # También se ejecuta tras publicaciones de bots 593: sus pushes no disparan otros workflows.
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar archivos CSV
        run: |
          node scripts/test-meta-web.cjs
          node scripts/test-validar-exportacion-593.cjs
          node scripts/test-exportar-canales.cjs
          node scripts/exportar-canales.cjs
      - name: Guardar exportaciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/exportar-canales.cjs
            git add exportaciones/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualizar exportaciones multicanal"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Sincronizar fuente existente y conjuntos de Meta
        env:
          META_SYNC_ENABLED: 'true'
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: 'v26.0'
        run: node scripts/sincronizar-conjuntos-meta.cjs
      - name: Conservar punto de reanudación de la importación
        if: always()
        run: |
          if [ ! -f work/auto-meta/importacion.json ]; then exit 0; fi
          cp work/auto-meta/importacion.json /tmp/conectatech-importacion.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p reportes/integracion-whatsapp
            cp /tmp/conectatech-importacion.json reportes/integracion-whatsapp/ultima-importacion.json
            git add reportes/integracion-whatsapp/ultima-importacion.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Conservar referencia de importación Meta para reanudación"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Conservar resultado verificable de Meta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-catalogo-meta
          path: work/auto-meta/resultado.json
          retention-days: 7
          if-no-files-found: warn
