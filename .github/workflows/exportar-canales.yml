name: Exportar catálogo multicanal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seo-contenido.json'
      - 'scripts/exportar-canales.cjs'
      - 'seo-pages.json'
permissions:
  contents: write
concurrency:
  group: exportacion-canales-main
  cancel-in-progress: false
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar archivos CSV
        run: node scripts/exportar-canales.cjs
      - name: Guardar exportaciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/exportar-canales.cjs
            git add exportaciones/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualizar exportaciones multicanal"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
