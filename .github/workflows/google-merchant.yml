name: Google Merchant — feed aislado gratuito
on:
  workflow_dispatch:
  push:
    branches: [main, integracion/google-merchant-20261016]
    paths:
      - 'google-merchant/generar.py'
      - 'google-merchant/test_feed.py'
      - '.github/workflows/google-merchant.yml'
      - 'index.html'
      - 'seo-contenido.json'
      - 'seo-pages.json'
      - 'datos-593/inventario-publico.csv'
      - 'importacion/contratos/**'
      - 'productos/**'
      - 'imagenes/**'
  schedule:
    - cron: '23 11 * * *'
permissions:
  contents: write
concurrency:
  group: google-merchant-feed-ec
  cancel-in-progress: false
jobs:
  feed:
    if: github.repository == 'conectatech-ec/conectatech-ec.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /seo-contenido.json
            /seo-pages.json
            /datos-593/inventario-publico.csv
            /importacion/contratos/
            /productos/
            /imagenes/*/*.webp
            /google-merchant/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar verificador de imágenes gratuito
        run: python -m pip install 'Pillow>=12.0,<13'
      - name: Pruebas y generación con verificación HTTPS
        run: |
          python -m unittest discover -s google-merchant -p test_feed.py
          python google-merchant/generar.py --verify-public
          git diff --exit-code -- . ':!google-merchant'
      - name: Publicar exclusivamente en rama de feed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const branch = 'feeds/google-merchant-ec';
            if (branch === 'main' || context.repo.repo !== 'conectatech-ec.github.io') throw new Error('Destino no autorizado');
            const summary = JSON.parse(fs.readFileSync('google-merchant/validacion.json', 'utf8'));
            const xml = fs.readFileSync('google-merchant/productos-ec.xml');
            if (summary.validacion !== 'local_y_http_publico' || summary.incluidos < 1 || crypto.createHash('sha256').update(xml).digest('hex') !== summary.feed_sha256) throw new Error('Validación insuficiente');
            let parent = null;
            let previousTree = null;
            try {
              parent = (await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch})).data.object.sha;
              previousTree = (await github.rest.git.getCommit({owner, repo, commit_sha: parent})).data.tree.sha;
            } catch (err) { if (err.status !== 404) throw err; }
            const names = ['productos-ec.xml', 'validacion.json', 'exclusiones.json', 'evidencias.json'];
            const tree = [];
            for (const name of names) {
              const blob = await github.rest.git.createBlob({owner, repo, content: fs.readFileSync('google-merchant/' + name).toString('base64'), encoding: 'base64'});
              tree.push({path: 'google-merchant/' + name, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            // Árbol nuevo: únicamente los cuatro archivos del feed, sin catálogo ni workflows.
            const result = await github.rest.git.createTree({owner, repo, tree});
            if (result.data.sha === previousTree) { core.info('Sin cambios'); return; }
            const commit = await github.rest.git.createCommit({owner, repo, tree: result.data.sha, parents: parent ? [parent] : [], message: 'Actualizar feed Google EC desde ' + context.sha});
            if (parent) await github.rest.git.updateRef({owner, repo, ref: 'heads/' + branch, sha: commit.data.sha, force: false});
            else await github.rest.git.createRef({owner, repo, ref: 'refs/heads/' + branch, sha: commit.data.sha});
            core.summary.addLink('Feed HTTPS', 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/refs/heads/' + branch + '/google-merchant/productos-ec.xml').addRaw('\nProductos: ' + summary.incluidos).write();
