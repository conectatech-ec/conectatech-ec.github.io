name: Auditar calidad SEO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seo-contenido.json'
      - 'scripts/auditar-seo.cjs'
      - 'index.html'
      - '.github/workflows/auditar-seo.yml'
permissions:
  contents: write
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Analizar fichas
        run: node scripts/auditar-seo.cjs
      - name: Guardar reporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/auditar-seo.cjs
            git add reporte-calidad-seo.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Actualizar auditoría SEO"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
