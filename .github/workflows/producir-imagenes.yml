name: Producir catálogo profesional por SKU
on:
  push:
    branches: [main]
    paths:
      - 'scripts/procesar-imagenes.py'
      - 'scripts/reglas_sku.py'
      - 'scripts/sincronizar-cola-drive.py'
      - 'scripts/test-incremental.py'
      - 'scripts/validar-contrato.py'
      - 'scripts/test-contrato.py'
      - 'scripts/registrar-resultados-lote.py'
      - 'scripts/registrar-actualizaciones.py'
      - 'scripts/test-actualizaciones.py'
      - 'importacion/piloto-imagenes.json'
      - '.github/workflows/producir-imagenes.yml'
  workflow_dispatch:
    inputs:
      manifiesto:
        description: Manifiesto revisado del lote; versión 3 obligatoria para aplicar y publicar
        required: true
        default: importacion/lotes/cola-010.json
      reglas_csv:
        description: Excepciones nuevas (CSV); vacío conserva todas las reglas
        default: ''
      aplicar:
        description: Aplicar y publicar resultados válidos
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: importacion-productos-main
  cancel-in-progress: false
jobs:
  producir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r importacion/requirements.txt
      - name: Probar protección e incrementalidad
        run: |
          python scripts/test-incremental.py
          python scripts/test-contrato.py
          python scripts/test-actualizaciones.py
      - name: Registrar reglas y procesar lote
        if: github.event_name == 'workflow_dispatch'
        env:
          MANIFIESTO: ${{ inputs.manifiesto || 'importacion/lotes/cola-010.json' }}
          REGLAS_CSV: ${{ inputs.reglas_csv }}
          APLICAR: ${{ inputs.aplicar }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          for key in ('MANIFIESTO','REGLAS_CSV'):
              value=os.environ[key]
              if value:
                  path=(Path.cwd()/value).resolve()
                  if not path.is_relative_to(Path.cwd()) or not path.is_file():raise SystemExit('Ruta no válida')
          if os.environ['APLICAR']=='true':
              manifest=json.loads(Path(os.environ['MANIFIESTO']).read_text())
              if manifest.get('version')!=3:
                  raise SystemExit('Aplicación bloqueada: se exige manifiesto versión 3 con contratos verificables')
              if not manifest.get('skus'):
                  raise SystemExit('Aplicación bloqueada: el manifiesto no contiene SKU')
          PY
          if [ -n "$REGLAS_CSV" ]; then
            # También la simulación usa las reglas propuestas, solo en el checkout efímero.
            python scripts/reglas_sku.py --csv "$REGLAS_CSV" --aplicar
          fi
          argumentos=()
          if [ "$APLICAR" = "true" ]; then argumentos+=(--aplicar); fi
          python scripts/procesar-imagenes.py --manifiesto "$MANIFIESTO" "${argumentos[@]}"
      - name: Aplicar reglas a fichas y exportaciones
        if: inputs.aplicar
        run: |
          node scripts/generar-seo.cjs
          node scripts/exportar-canales.cjs
          cp reportes/procesamiento-imagenes.json "reportes/produccion-${GITHUB_RUN_ID}.json"
      - name: Publicar sin sobrescribir cambios concurrentes
        if: inputs.aplicar
        env:
          MANIFIESTO: ${{ inputs.manifiesto }}
        run: |
          # Este control incluye la evidencia móvil vinculada al HTML e imágenes finales.
          # Un fallo impide el commit y el push, aunque el procesamiento local haya terminado.
          python scripts/validar-contrato.py --manifiesto "$MANIFIESTO" --fase prepublicacion --reporte "reportes/contratos-prepublicacion-${GITHUB_RUN_ID}.json"
          git add index.html seo-contenido.json seo-pages.json sitemap.xml productos imagenes exportaciones importacion/reglas-sku.json importacion/medios.json reportes "$MANIFIESTO"
          if [ -d importacion/contratos ]; then git add importacion/contratos; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Producir imágenes por SKU con reglas persistentes"
          git push origin HEAD:main
      - name: Reconstruir Pages
        if: inputs.aplicar
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verificar publicación
        id: verificar_publicacion
        if: inputs.aplicar
        run: |
          python - <<'PY'
          import json,os,subprocess,time
          from pathlib import Path
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('publicados=false\n')
          report=json.load(open('reportes/procesamiento-imagenes.json'))
          sku=[x['sku'] for x in report['productos'] if x['estado']=='aplicado_local']
          if not sku:raise SystemExit(0)
          for attempt in range(8):
              result=subprocess.run(['python','scripts/verificar-publicacion.py','--sku',*sku])
              if result.returncode==0:break
              if attempt==7:raise SystemExit(1)
              time.sleep(30)
          path=Path('reportes/verificacion-publicacion.json')
          if not path.is_file():raise SystemExit(0)
          verified=json.loads(path.read_text())
          if any(x.get('sku') in sku and x.get('estado')=='publicado_verificado' for x in verified.get('resultados', [])):
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:
                  output.write('publicados=true\n')
          PY
      - name: Registrar fechas de contenido publicado y verificado
        if: inputs.aplicar && steps.verificar_publicacion.outputs.publicados == 'true'
        run: |
          if [ ! -f reportes/verificacion-publicacion.json ]; then exit 0; fi
          python scripts/registrar-actualizaciones.py --reporte-http reportes/verificacion-publicacion.json --aplicar --reporte "reportes/actualizaciones-${GITHUB_RUN_ID}.json"
      - name: Conservar verificación HTTP en el repositorio
        id: guardar_actualizaciones
        if: inputs.aplicar && steps.verificar_publicacion.outputs.publicados == 'true'
        run: |
          echo 'publicado=false' >> "$GITHUB_OUTPUT"
          if [ ! -f reportes/verificacion-publicacion.json ]; then exit 0; fi
          cp reportes/verificacion-publicacion.json "reportes/verificacion-${GITHUB_RUN_ID}.json"
          git add reportes/verificacion-publicacion.json "reportes/verificacion-${GITHUB_RUN_ID}.json"
          git add importacion/actualizaciones-sku.json assets/catalogo-publicado.js index.html "reportes/actualizaciones-${GITHUB_RUN_ID}.json"
          if git diff --cached --quiet; then exit 0; fi
          base_publicada=$(git rev-parse HEAD)
          git commit -m "Registrar verificación HTTP del lote"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$base_publicada" ]; then
            echo 'Publicación detenida: main cambió durante la verificación; repetir sobre la base nueva.' >&2
            exit 1
          fi
          git push origin HEAD:main
          echo 'publicado=true' >> "$GITHUB_OUTPUT"
      - name: Reconstruir Pages con las fechas verificadas
        if: inputs.aplicar && steps.guardar_actualizaciones.outputs.publicado == 'true'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Comprobar el catálogo y su registro servidos por Pages
        if: inputs.aplicar && steps.guardar_actualizaciones.outputs.publicado == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          base='https://conectatech-ec.github.io'
          files={'index.html':'/', 'assets/catalogo-publicado.js':'/assets/catalogo-publicado.js'}
          expected={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files}
          result=[]
          for attempt in range(8):
              result=[]
              for name,path in files.items():
                  url=base+path+'?verificacion='+os.environ['GITHUB_RUN_ID']+'-'+str(attempt)
                  row={'archivo':name,'url':base+path,'sha256_esperado':expected[name]}
                  try:
                      request=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=25) as response:
                          row.update(http=response.status,sha256_http=hashlib.sha256(response.read()).hexdigest())
                      row['verificado']=row['http']==200 and row['sha256_http']==expected[name]
                  except Exception as exc:
                      row.update(verificado=False,error=str(exc))
                  result.append(row)
              if all(row['verificado'] for row in result):break
              if attempt<7:time.sleep(30)
          report={'resultados':result,'verificado':all(row['verificado'] for row in result)}
          Path('reportes/cache-publicado-'+os.environ['GITHUB_RUN_ID']+'.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          if not report['verificado']:raise SystemExit('Pages no sirve aún los hashes esperados del catálogo y sus fechas')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-produccion
          path: reportes/*.json
